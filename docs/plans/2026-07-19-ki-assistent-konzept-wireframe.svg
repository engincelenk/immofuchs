<svg viewBox="0 0 720 700" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <style>
      .navy{fill:#1E3A5F;} .orange{fill:#E8650A;} .surface{fill:#F8F9FA;}
      .text{fill:#1A1A2E;} .white{fill:#FFFFFF;}
      .yellow{fill:#f59e0b;} .yellowBg{fill:#fef3c7;}
      .label{font-size:15px; fill:#1A1A2E; font-weight:600;}
      .small{font-size:11px; fill:#5b6472;}
      .body{font-size:12px; fill:#1A1A2E;}
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="700" fill="#EDEFF2"/>

  <!-- ===== Frame 1: Ruhezustand ===== -->
  <text x="180" y="30" text-anchor="middle" class="label">1 · Ergebnis mit Assistant-Chip</text>
  <g>
    <rect x="30" y="50" width="300" height="600" rx="28" fill="#111" opacity="0.08"/>
    <rect x="34" y="54" width="292" height="592" rx="24" class="white" stroke="#d7dbe1" stroke-width="1"/>

    <!-- header -->
    <path d="M34 78 a24 24 0 0 1 24 -24 h244 a24 24 0 0 1 24 24 v30 h-292 z" class="navy"/>
    <text x="180" y="97" text-anchor="middle" fill="white" font-size="15" font-weight="700">🦊 ImmoFuchs</text>

    <!-- ergebnis card 1 -->
    <rect x="54" y="130" width="252" height="86" rx="12" class="surface" stroke="#e2e5ea"/>
    <text x="70" y="155" class="small">Nettorendite</text>
    <text x="70" y="182" font-size="22" font-weight="700" class="text">4,1 %</text>
    <rect x="220" y="140" width="66" height="24" rx="12" class="yellowBg"/>
    <text x="253" y="156" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">~ gelb</text>
    <text x="70" y="200" class="small">grenzwertig</text>

    <!-- ergebnis card 2 -->
    <rect x="54" y="228" width="252" height="70" rx="12" class="surface" stroke="#e2e5ea"/>
    <text x="70" y="252" class="small">Kaufpreisfaktor</text>
    <text x="70" y="276" font-size="18" font-weight="700" class="text">27,3 ×</text>
    <rect x="220" y="238" width="66" height="24" rx="12" class="yellowBg"/>
    <text x="253" y="254" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">~ gelb</text>

    <!-- assistant chip -->
    <rect x="70" y="316" width="220" height="42" rx="21" fill="white" stroke="#E8650A" stroke-width="2"/>
    <text x="180" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#E8650A">🦊 Frag den Assistenten</text>

    <!-- weitere karten platzhalter -->
    <rect x="54" y="378" width="252" height="40" rx="12" fill="#F1F2F4"/>
    <rect x="54" y="428" width="252" height="40" rx="12" fill="#F1F2F4"/>
  </g>

  <!-- arrow -->
  <path d="M340 350 L378 350" stroke="#1E3A5F" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#1E3A5F"/>
    </marker>
  </defs>

  <!-- ===== Frame 2: Chat offen ===== -->
  <text x="540" y="30" text-anchor="middle" class="label">2 · Chat-Bottom-Sheet offen</text>
  <g>
    <rect x="390" y="50" width="300" height="600" rx="28" fill="#111" opacity="0.08"/>
    <rect x="394" y="54" width="292" height="592" rx="24" class="white" stroke="#d7dbe1" stroke-width="1"/>

    <path d="M394 78 a24 24 0 0 1 24 -24 h244 a24 24 0 0 1 24 24 v30 h-292 z" class="navy" opacity="0.55"/>
    <text x="540" y="97" text-anchor="middle" fill="white" font-size="15" font-weight="700" opacity="0.7">🦊 ImmoFuchs</text>
    <rect x="394" y="108" width="292" height="120" fill="#111" opacity="0.12"/>

    <!-- bottom sheet -->
    <rect x="394" y="228" width="292" height="418" rx="20" class="surface" stroke="#d7dbe1"/>
    <rect x="516" y="240" width="48" height="5" rx="2.5" fill="#c7cbd1"/>

    <rect x="414" y="256" width="252" height="22" rx="11" fill="#e9ecf0"/>
    <text x="540" y="271" text-anchor="middle" font-size="10" fill="#5b6472">Bezieht sich auf: Nettorendite</text>

    <!-- assistant bubble -->
    <rect x="414" y="288" width="240" height="92" rx="14" fill="white" stroke="#e2e5ea"/>
    <text x="428" y="308" font-size="12" font-weight="700" fill="#1E3A5F">🦊 Assistent</text>
    <text x="428" y="326" class="body">Deine Nettorendite liegt bei</text>
    <text x="428" y="342" class="body">4,1 % – das ist grenzwertig.</text>
    <text x="428" y="358" class="body">Ab 3,5 % gilt sie als solide,</text>
    <text x="428" y="374" class="body">ab 5 % als stark.</text>

    <!-- suggested chips -->
    <rect x="414" y="392" width="150" height="30" rx="15" fill="white" stroke="#E8650A"/>
    <text x="489" y="411" text-anchor="middle" font-size="10" fill="#E8650A">Was verbessern?</text>
    <rect x="572" y="392" width="94" height="30" rx="15" fill="white" stroke="#E8650A"/>
    <text x="619" y="411" text-anchor="middle" font-size="10" fill="#E8650A">KP-Faktor?</text>

    <rect x="414" y="432" width="252" height="30" rx="15" fill="white" stroke="#E8650A"/>
    <text x="440" y="451" font-size="10" fill="#E8650A">Kaufpreisfaktor erklären</text>

    <!-- user bubble -->
    <rect x="446" y="474" width="208" height="40" rx="14" class="navy"/>
    <text x="460" y="498" font-size="12" fill="white">Was kann ich verbessern?</text>

    <!-- input -->
    <rect x="414" y="600" width="212" height="42" rx="12" fill="white" stroke="#1E3A5F" stroke-width="1.5"/>
    <text x="428" y="626" font-size="12" fill="#8a92a0">Frag etwas …</text>
    <circle cx="654" cy="621" r="21" class="orange"/>
    <text x="654" y="627" text-anchor="middle" fill="white" font-size="16">➤</text>
  </g>

  <text x="360" y="682" text-anchor="middle" class="small">ImmoFuchs KI-Assistent — Wireframe-Konzept · Farben/Radius aus bestehendem Design-System, keine neuen Tokens</text>
</svg>
