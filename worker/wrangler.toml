database_name = "immofuchs-prod"
database_id = "09781d0c-cc60-47f8-97f9-5e26afa7cd1c"
migrations_dir = "migrations"

[[env.failover.r2_buckets]]
binding = "BACKUPS"
bucket_name = "immofuchs-backups-prod"
jurisdiction = "eu"

[[env.failover.durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "SessionRateLimiter"

[[env.failover.migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRateLimiter"]
