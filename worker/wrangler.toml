[env.qa.triggers]
crons = ["0 6 * * *"]

[[env.qa.r2_buckets]]
binding = "BACKUPS"
bucket_name = "immofuchs-backups-qa"
jurisdiction = "eu"

[env.qa.observability]
enabled = true
head_sampling_rate = 1

[env.qa.ai]
binding = "AI"

# qa ist der Zwilling von prod und teilt sich DIESELBE Datenbank (seit 2026-10-08, Weg A): immer derselbe Datenstand,
# kein Abzug noetig. Im Standby (STANDBY = "true") darf qa nichts schreiben ausser Anmelden/Assistent/Admin und
# verschickt nichts (src/standby.ts). Die frueher benutzte Datenbank immofuchs-qa (6ca47997-...) bleibt ungenutzt bestehen.
# Folge: Datenbank-Migrationen gelten fuer prod UND qa gleichzeitig und muessen abwaertskompatibel sein, denn qa laeuft
# eine Version hinter prod (Reihenfolge: dev -> prod -> qa).
[[env.qa.d1_databases]]
binding = "DB"
database_name = "immofuchs-prod"
database_id = "09781d0c-cc60-47f8-97f9-5e26afa7cd1c"
migrations_dir = "migrations"

[[env.qa.durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "SessionRateLimiter"

[[env.qa.migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRateLimiter"]

# ═══ Failover: der qa-Worker uebernimmt die Rolle von prod (docs/betrieb/notfall-runbook.md, Abschnitt "Umschalten auf qa") ═══
# Gleicher Worker wie qa (gleicher Name, damit dieselben Secrets gelten), aber:
#  - Custom Domain api.immofuchs.info (zusaetzlich zu api-qa), STANDBY aus, Variablen wie prod,
#  - prod-Datenbank und prod-Sicherungsspeicher, ein Cron-Trigger (Taegliches 06:00; ein zweiter ginge ueber die Free-Plan-Grenze).
# Einspielen: npx wrangler deploy --env failover   (vorher api.immofuchs.info beim prod-Worker freigeben, siehe Runbook).
# Zurueck in den Standby: npx wrangler deploy --env qa
[env.failover]
name = "immofuchs-assistant-qa"

[[env.failover.routes]]
pattern = "api.immofuchs.info"
custom_domain = true
zone_name = "immofuchs.info"

[[env.failover.routes]]
pattern = "api-qa.immofuchs.info"
custom_domain = true
zone_name = "immofuchs.info"

[env.failover.triggers]
# Nur EIN Cron: Der Free-Plan erlaubt 5 Cron-Trigger je Konto, und mit dem Worker "gold-radar-wecker" (anderes Projekt)
# sind dev (1) + prod (2) + qa (1) + dieser bereits 5. Ein zweiter Cron fuer den Failover-Worker scheiterte im
# Probelauf vom 2026-10-08 (Worker und Domain wurden trotzdem eingespielt, aber Wrangler meldete einen Fehler).
# Die Sicherung um 06:30 laeuft deshalb weiter vom prod-Worker bzw. von Hand (Admin-Dashboard "Jetzt sichern").
crons = ["0 6 * * *"]

[env.failover.observability]
enabled = true
head_sampling_rate = 1

[env.failover.vars]
ASSISTANT_ENABLED = "true"
# Prod-Kaufsperre: nur Admin-Konten koennen kaufen (worker/src/checkoutGate.ts).
# Zum Freischalten im Cloudflare-Dashboard auf "true" setzen bzw. entfernen.
# Gilt nur hier (Prod); dev/qa haben eigene [vars] und bleiben offen.
CHECKOUT_ENABLED = "false"
# Jahresabo -> nach dem ersten Jahr automatisch Monatsplan (AGB Ziffer 6, § 309 Nr. 9 BGB: keine stillschweigende
# Verlaengerung um ein weiteres Jahr bei Verbrauchern). Umsetzung ueber eine Stripe Subscription Schedule
# (worker/src/stripe/checkout.ts, ensureYearlyToMonthlySchedule). Auf prod seit 2026-10-08 an (Entscheidung des Inhabers).
# Auf prod ist der Mechanismus noch durch einen echten Jahres-Testkauf zu bestaetigen (Zeitplan mit zwei Phasen in Stripe pruefen).
YEARLY_AUTO_MONTHLY = "true"
# Prod-Registrierungssperre: keine neuen Konten ueber die oeffentlichen Wege
# (worker/src/registrationGate.ts). Bestehende Konten melden sich normal an.
# Im Admin-Dashboard umschaltbar; der Schalter dort schlaegt diesen Wert.
REGISTRATION_ENABLED = "false"
# Oeffentlicher Schluessel fuer die verschluesselte Sicherung (RSA-4096). Der Worker kann damit NUR verschluesseln;
# der private Schluessel liegt ausschliesslich beim Betreiber (docs/betrieb/backup-schluessel.txt + Offline-Kopie).
BACKUP_PUBLIC_KEY = "-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAkUFCQ2Gyp4nZ2D+vPaX+\nyro5XX7fGuH0/VmbCdt9oWrmeYe8qyBaZnMfk+rEOC920ZLTR1vOqDntMWnIMC6f\n5EFIY7TIL3yAia6sRby6pB2hhkihuHRBpFkP+cSYsmAyVjv1BVnKhxJTMZv1JWKZ\nwC74hrbs+6LEdHVRiy/65VDVGquV/oSjZouOwfXiRNppFcHXU16tjFVNDWfjnsWR\nTHMJkub1rQsMoBhKsRQO5b++18wxkvHRhiB/eDu/TLFP2uwkRr7xajkHpNZa6sSm\n7qk7qFxhZplPRBKVpm6KpAhIMMeQlkY1i+bke/+wrh1W7G0HniX2wez79jAC5RvE\nSdpDVfOuoNXZvRFymxxVPYuRK1IaqrmvYqq5dmTrZRVh4+xlu8kX34P8GjhfamiC\nbWweaBpYfc/h9sH/xk969Zp7kxnSBFdSH+GV3kx4GRsNtmSeBzW1galG2ERX63v0\nmXYWQfpGrqxoiOh+HEKluZLD2JWtK38Pe9Nt3iaCEpCisy8+IzfiK4XaOqfh18yV\nsEpx3eeWPDBSoAtgpQHtdiAl0A/NO+ERXMjKkJCQPtqxW+wQS2VPc7jr4YMsrlRo\nibsfzgRYy7rG7zjkJgpUK41CbQT05+QmHSWLQqL0ZwkDmKTmzJCkUD0FSx4+Hi2l\nOverDQ0pvpjdEEwek6ndM3kCAwEAAQ==\n-----END PUBLIC KEY-----\n"
