name: 📊 Monthly Data Update

on:
  schedule:
    # 1. jeden Monats um 07:00 UTC = 08:00 MEZ / 09:00 MESZ
    - cron: "0 7 1 * *"
  workflow_dispatch:
    # Manuell auslösbar: GitHub → Actions → Monthly Data Update → Run workflow

# Noetig, damit der Commit-Schritt unten den GITHUB_TOKEN zum Zurueckpushen
# nutzen darf (Default-Token ist sonst read-only fuer contents).
permissions:
  contents: write
  issues: write

jobs:
  update-and-deploy:
    name: Update Market Data & Deploy (${{ matrix.env.name }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false, damit z.B. ein fehlgeschlagener PROD-Build nicht auch
      # den DEV/QA-Lauf abbricht - die drei Umgebungen sind unabhaengig.
      fail-fast: false
      matrix:
        env:
          - name: PROD
            branch: main
            target: /immofuchs
            slug: prod
          - name: DEV
            branch: Immofuchs-dev
            target: /dev.immofuchs.info
            slug: dev
          - name: QA
            branch: Immofuchs-qa
            target: /qa.immofuchs.info
            slug: qa

    # Gleiche Gruppe wie im jeweiligen deploy-*.yml fuer dieselbe Umgebung -
    # verhindert, dass dieser Job und ein Push-Deploy gleichzeitig auf
    # denselben Zielordner mirror --delete fahren und sich gegenseitig
    # ueberschreiben (Ursache des Vorfalls vom 24.08.2026: ein veralteter
    # main-Lauf hat DEV/QA nach einem frischen Push wieder zurueckgesetzt).
    concurrency:
      group: deploy-${{ matrix.env.slug }}
      cancel-in-progress: true

    steps:
      # ── 1. Checkout - JEDE Umgebung von ihrem EIGENEN Branch ──────────────
      # Frueher: ein einziger Checkout von main, dessen Build wurde auf PROD,
      # DEV und QA gemeinsam deployt. main lag aber oft Wochen hinter
      # Immofuchs-dev/-qa zurueck (Feature-Branches werden manuell per
      # push.ps1 gemergt) - der Monats-Job hat dev.immofuchs.info und
      # qa.immofuchs.info damit jedes Mal auf den alten main-Stand
      # zurueckgesetzt und bereits live getestete Features praktisch wieder
      # "ausgerollt" (siehe 2026-08-01/02: Expose-Upload verschwand so von
      # dev+qa). Jetzt bekommt jede Umgebung ihren eigenen Branch-Stand,
      # nur die Marktdaten werden aufgefrischt.
      - name: 🚚 Code auschecken (${{ matrix.env.branch }})
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.env.branch }}

      # ── 2. Python einrichten ─────────────────────────────────────────────
      - name: 🐍 Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 📦 Python-Abhängigkeiten installieren
        run: |
          pip install requests pdfplumber playwright
          playwright install --with-deps chromium

      # ── 3. Marktdaten aktualisieren ──────────────────────────────────────
      # Seit 2026-08-24 ohne LLM: Bundesbank-PDF (pdfplumber) + Interhyp-
      # Zinstabelle (Playwright, da clientseitig gerendert) - kein
      # ANTHROPIC_API_KEY/Guthaben mehr noetig, siehe scripts/monthly_update.py.
      - name: 🔄 Marktdaten aktualisieren
        id: update
        run: python scripts/monthly_update.py

      # ── 4. Änderungen committen UND zurückpushen - data.js/translations.js/
      #      zinsen.json bleiben so dauerhaft die Quelle der Wahrheit in Git,
      #      statt nur einmalig auf dem Runner fuer diesen einen Deploy zu
      #      existieren und beim naechsten Push auf den Branch wieder auf den
      #      alten committeten Stand zurueckzufallen (siehe Vorfall
      #      24.08.2026: main/QA zeigten Monate spaeter noch den Mai-Stand,
      #      weil hier nie gepusht wurde). ───────────────────────────────────
      - name: 📝 Änderungen committen & pushen
        run: |
          git config --global user.name "ImmoFuchs Bot"
          git config --global user.email "bot@immofuchs.info"
          git add src/data.js src/i18n/translations.js public/zinsen.json public/datenstatus.html
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit nötig"
          else
            MONTH=$(date +'%B %Y')
            git commit -m "data: Monatliches Update $MONTH (${{ matrix.env.name }})"
            git push origin HEAD:${{ matrix.env.branch }}
            echo "✓ Commit erstellt und gepusht"
          fi

      # ── 4b. Faelligkeits-Issue - nur einmal (PROD-Zweig genuegt, die
      #        Pflegeintervalle sind branch-unabhaengig dieselben Werte) ─────
      - name: 🔔 Fälligkeits-Issue aktualisieren
        if: matrix.env.slug == 'prod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERDUE: ${{ steps.update.outputs.overdue }}
        run: |
          TITLE="🗓️ Datenpflege überfällig"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -n "$OVERDUE" ]; then
            BODY="Folgende Konstanten in \`src/data.js\` sind laut ihrem Pflegeintervall überfällig und müssen von Hand aktualisiert werden:

          \`\`\`
          $OVERDUE
          \`\`\`

          Übersicht aller Werte: siehe \`public/datenstatus.html\` (mit deployt).
          Zum Aktualisieren: neuen Wert + Quelle angeben, \`src/data.js\` entsprechend anpassen (\`stand\`-Feld nicht vergessen).

          _Automatisch erzeugt vom Monthly-Data-Update-Workflow._"
            if [ -n "$EXISTING" ]; then
              gh issue edit "$EXISTING" --repo "${{ github.repository }}" --body "$BODY" --add-assignee "${{ github.repository_owner }}"
              echo "Issue #$EXISTING aktualisiert"
            else
              gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --assignee "${{ github.repository_owner }}"
              echo "Neues Issue erstellt"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "${{ github.repository }}" --comment "Alle Werte sind wieder innerhalb ihres Pflegeintervalls."
            echo "Issue #$EXISTING geschlossen"
          else
            echo "Nichts überfällig, kein offenes Issue vorhanden"
          fi

      # ── 5. Build ─────────────────────────────────────────────────────────
      - name: 🛠️ Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Build
        run: |
          npm ci
          npm run build

      # ── 6. Deploy - NUR die eigene Umgebung, nicht mehr alle drei ─────────
      - name: 📦 lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: 🚀 Deploy → ${{ matrix.env.name }}
        env:
          SSH_HOST: ${{ secrets.IONOS_FTP_SERVER }}
          SSH_USER: ${{ secrets.IONOS_FTP_USERNAME }}
          SSH_PASS: ${{ secrets.IONOS_FTP_PASSWORD }}
        run: |
          lftp -c "
          set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=no';
          open -u $SSH_USER,$SSH_PASS sftp://$SSH_HOST:22;
          mirror -R ./dist ${{ matrix.env.target }} --reverse --verbose --continue --delete;
          quit;
          "
