name: 📊 Monthly Data Update

on:
  schedule:
    # 1. jeden Monats um 07:00 UTC = 08:00 MEZ / 09:00 MESZ
    - cron: "0 7 1 * *"
  workflow_dispatch:
    # Manuell auslösbar: GitHub → Actions → Monthly Data Update → Run workflow

# Noetig, damit der Commit-Schritt unten den GITHUB_TOKEN zum Zurueckpushen
# nutzen darf (Default-Token ist sonst read-only fuer contents).
permissions:
  contents: write
  # actions: write - dieser Job stoesst die regulaeren deploy-*.yml per
  # workflow_dispatch an, statt selbst zu bauen und zu spiegeln (siehe unten).
  actions: write

jobs:
  update-and-deploy:
    name: Update Market Data & Deploy (${{ matrix.env.name }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false, damit z.B. ein fehlgeschlagener PROD-Build nicht auch
      # den DEV/QA-Lauf abbricht - die drei Umgebungen sind unabhaengig.
      fail-fast: false
      matrix:
        env:
          - name: PROD
            branch: main
            slug: prod
          - name: DEV
            branch: Immofuchs-dev
            slug: dev
          - name: QA
            branch: Immofuchs-qa
            slug: qa

    # Bewusst KEINE concurrency-Gruppe mehr: dieser Job spiegelt seit
    # 2026-09-03 nicht mehr selbst auf den Zielordner, sondern stoesst das
    # deploy-*.yml der Umgebung an. Stuende er weiter in der Gruppe
    # "deploy-<slug>", wuerde ihn genau der Deploy-Lauf, den er gerade
    # ausgeloest hat, per cancel-in-progress mitten im Job abbrechen.

    steps:
      # ── 1. Checkout - JEDE Umgebung von ihrem EIGENEN Branch ──────────────
      # Frueher: ein einziger Checkout von main, dessen Build wurde auf PROD,
      # DEV und QA gemeinsam deployt. main lag aber oft Wochen hinter
      # Immofuchs-dev/-qa zurueck (Feature-Branches werden manuell per
      # push.ps1 gemergt) - der Monats-Job hat dev.immofuchs.info und
      # qa.immofuchs.info damit jedes Mal auf den alten main-Stand
      # zurueckgesetzt und bereits live getestete Features praktisch wieder
      # "ausgerollt" (siehe 2026-08-01/02: Expose-Upload verschwand so von
      # dev+qa). Jetzt bekommt jede Umgebung ihren eigenen Branch-Stand,
      # nur die Marktdaten werden aufgefrischt.
      - name: 🚚 Code auschecken (${{ matrix.env.branch }})
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.env.branch }}

      # ── 2. Python einrichten ─────────────────────────────────────────────
      - name: 🐍 Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 📦 Python-Abhängigkeiten installieren
        # Die Paketliste steht in scripts/requirements.txt und NICHT hier: bei
        # schedule-Laeufen nimmt GitHub diese YAML immer vom Default-Branch
        # (main), das Skript aber vom jeweiligen Matrix-Branch. Eine hier fest
        # verdrahtete Liste laeuft dadurch zwangslaeufig auseinander, sobald
        # das Skript auf einem Branch eine neue Bibliothek importiert - genau
        # das war die Ursache des monatelangen "ModuleNotFoundError:
        # pdfplumber": hier stand noch "pip install anthropic requests",
        # waehrend das Skript laengst pdfplumber importierte. Neue
        # Abhaengigkeit daher in scripts/requirements.txt eintragen, im selben
        # Branch wie die Skript-Aenderung.
        run: |
          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          else
            echo "::warning::scripts/requirements.txt fehlt auf ${{ matrix.env.branch }} - Fallback-Liste wird installiert"
            pip install requests pdfplumber playwright
          fi
          # Browser-Download nur, wenn das Skript Playwright ueberhaupt nutzt.
          if python -c "import playwright" 2>/dev/null; then
            python -m playwright install --with-deps chromium
          fi

      # ── 3. Marktdaten aktualisieren ──────────────────────────────────────
      - name: 🔄 Marktdaten aktualisieren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/monthly_update.py

      # ── 4. Änderungen committen UND zurückpushen - data.js/translations.js/
      #      zinsen.json bleiben so dauerhaft die Quelle der Wahrheit in Git,
      #      statt nur einmalig auf dem Runner fuer diesen einen Deploy zu
      #      existieren und beim naechsten Push auf den Branch wieder auf den
      #      alten committeten Stand zurueckzufallen (siehe Vorfall
      #      24.08.2026: main/QA zeigten Monate spaeter noch den Mai-Stand,
      #      weil hier nie gepusht wurde). ───────────────────────────────────
      - name: 📝 Änderungen committen & pushen
        id: commit
        run: |
          git config --global user.name "ImmoFuchs Bot"
          git config --global user.email "bot@immofuchs.info"
          git add src/data.js src/i18n/translations.js public/zinsen.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit nötig"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            MONTH=$(date +'%B %Y')
            git commit -m "data: Monatliches Update $MONTH (${{ matrix.env.name }})"
            git push origin HEAD:${{ matrix.env.branch }}
            echo "✓ Commit erstellt und gepusht"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 5. Deploy - NICHT mehr selbst bauen und spiegeln, sondern den
      #      regulaeren Deploy-Workflow der Umgebung anstossen.
      #
      #      Grund (Vorfall 2026-09-03): hier stand ein eigenes
      #      "npm ci && npm run build" OHNE die VITE_*-Variablen, die
      #      deploy-dev/qa/prod.yml setzen. Ohne VITE_ASSISTANT_URL liefert
      #      apiBase() (src/utils/apiBase.js) einen Leerstring, alle
      #      /api/v1/*-Aufrufe gingen dadurch relativ an den IONOS-Webspace
      #      statt an den Worker (404 bei /me und der kapp15-Liste); Stripe-
      #      und Turnstile-Key fehlten ebenso. Dieser Build wurde per
      #      "mirror --delete" ueber PROD, QA und DEV gespiegelt - kaputt ging
      #      dabei aber nur DEV: main und Immofuchs-qa fuehren den Konto-/
      #      API-Teil (src/utils/apiBase.js, VITE_ASSISTANT_URL) noch gar
      #      nicht, dort fehlte also nichts. Sobald dieser Stand nach qa/main
      #      wandert, traefe es die beiden genauso. Die
      #      Build-Umgebung steht jetzt nur noch an EINER Stelle je Umgebung -
      #      im jeweiligen deploy-*.yml - und kann hier nicht mehr veralten.
      #
      #      Der Push oben startet die Deploy-Workflows nicht von selbst:
      #      GitHub loest aus einem Push mit GITHUB_TOKEN bewusst keine
      #      weiteren Workflows aus (Endlosschleifen-Schutz). Daher der
      #      explizite workflow_dispatch - er braucht "actions: write" oben.
      - name: 🚀 Deploy anstoßen (${{ matrix.env.name }})
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "deploy-${{ matrix.env.slug }}.yml" \
            --repo "${{ github.repository }}" \
            --ref "${{ matrix.env.branch }}"
          echo "✓ deploy-${{ matrix.env.slug }}.yml auf ${{ matrix.env.branch }} angestossen"

      - name: ⏭️ Kein Deploy nötig
        if: steps.commit.outputs.changed != 'true'
        run: echo "Keine Datenänderung — ${{ matrix.env.name }} bleibt auf seinem aktuellen Stand."
