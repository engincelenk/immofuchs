name: 🐕 Monatsjob-Waechter (PROD + QA)

# Prueft taeglich, ob der Monatsjob (monthly-update.yml) im laufenden Monat auf PROD und
# QA gelaufen ist - erkennbar an "Letzter Lauf: TT.MM.JJJJ" in
# <umgebung>/datenstatus.html. Die Seite schreibt der Monatsjob bei jedem Lauf neu, online
# kommt sie erst ueber den anschliessenden Deploy - geprueft werden also Lauf UND Deploy.
# prod und qa sind Zwillinge auf main (Modell seit 2026-10-11), werden aber getrennt
# deployt; deshalb werden beide Adressen geprueft. dev wird NICHT mehr geprueft (bis
# 2026-10-21 war es umgekehrt: nur dev, Nutzer-Vorgabe 2026-10-01; geaendert am
# 2026-10-22 auf Wunsch des Nutzers).
# Hintergrund: am 01.09. und 01.10.2026 hat GitHub den geplanten Monatslauf gar nicht
# ausgeloest, und niemand hat es gemerkt. Ab dem 3. des Monats oeffnet dieser Waechter
# bei veraltetem Stand ein Issue und der Lauf wird rot (GitHub benachrichtigt dann per
# Mail). Ist der Stand wieder aktuell, schliesst er das Issue.
#
# Taeglich statt monatlich, damit ein einzelner verworfener geplanter Lauf (wie beim
# Monatsjob) hier nicht ins Gewicht faellt. Geplante Laeufe kommen bei GitHub immer
# von main - Aenderungen an dieser Datei deshalb auch auf main (mit [skip ci]).

on:
  schedule:
    - cron: "41 8 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  pruefen:
    name: Zinsstand auf prod und qa pruefen
    runs-on: ubuntu-latest
    steps:
      - name: 🔎 Stand pruefen und Issue pflegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Deutsche Zeit, passend zum Monatsjob und zu monthly_update.py
          TAG=$(TZ=Europe/Berlin date +%d)
          SOLL=$(TZ=Europe/Berlin date +%Y-%m)
          ABWEICHUNG=""
          NL=$'\n'
          for HOST in immofuchs.info qa.immofuchs.info; do
            # "Letzter Lauf: 01.11.2026 01:09 Uhr" -> 2026-11
            IST=$(curl -fsS "https://$HOST/datenstatus.html?nc=$(date +%s)" \
              | grep -oE 'Letzter Lauf: [0-9]{2}\.[0-9]{2}\.[0-9]{4}' \
              | sed -E 's/.*: [0-9]{2}\.([0-9]{2})\.([0-9]{4})/\2-\1/' || true)
            IST=${IST:-nicht-lesbar}
            echo "$HOST: Tag $TAG, erwartet $SOLL, gefunden $IST"
            if [ "$IST" != "$SOLL" ]; then
              ABWEICHUNG="${ABWEICHUNG}- \`$HOST\`: letzter Lauf \`$IST\` statt \`$SOLL\`${NL}"
            fi
          done

          TITLE="Monatsjob nicht gelaufen (PROD/QA)"
          OFFEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --search "$TITLE in:title" --state open --json number --jq '.[0].number')

          if [ -z "$ABWEICHUNG" ]; then
            echo "✓ Zinsstand ist auf prod und qa aktuell."
            if [ -n "$OFFEN" ]; then
              gh issue close "$OFFEN" --repo "$GITHUB_REPOSITORY" --comment "Zinsstand auf prod und qa ist wieder aktuell ($SOLL)."
            fi
            exit 0
          fi

          if [ "$((10#$TAG))" -lt 3 ]; then
            echo "Vor dem 3. des Monats - der Monatsjob hat noch Zeit (Ersatzlaeufe am 1. und 2.)."
            exit 0
          fi

          BODY="Am $(TZ=Europe/Berlin date +%d.%m.%Y) melden die Seiten unter /datenstatus.html einen veralteten Stand:

          ${ABWEICHUNG}
          Der Monatsjob ist nicht gelaufen, der anschliessende Deploy fehlt, oder eine Datenquelle (Bundesbank/Interhyp) war nicht erreichbar.

          Abhilfe: Actions -> Monthly Data Update -> **Run workflow** (Branch main). NICHT \"Re-run\" bei einem alten Lauf - der nimmt die alte Workflow-Datei.

          _Automatisch erzeugt vom Monatsjob-Waechter (.github/workflows/monthly-watchdog.yml)._"

          if [ -n "$OFFEN" ]; then
            gh issue edit "$OFFEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Issue #$OFFEN aktualisiert"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --assignee "$GITHUB_REPOSITORY_OWNER"
            echo "Issue erstellt"
          fi
          echo "::error::Monatsjob fuer $SOLL ist auf PROD/QA nicht gelaufen"
          exit 1
